<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 2732px;
    height: 2732px;
    background: radial-gradient(circle at 30% 22%, #1E4A2C 0%, #16321F 55%, #0F2317 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .wordmark { display: flex; align-items: baseline; }
  .word { color: #FFFFFF; font-size: 400px; font-weight: 800; letter-spacing: -12px; }
  .dot { color: #3B82F6; font-size: 400px; font-weight: 800; text-shadow: 0 0 60px rgba(59,130,246,0.65); }
</style>
</head>
<body>
  <div class="wordmark"><span class="word">İşinn</span><span class="dot">.</span></div>
</body>
</html>
