<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  /* Kullanıcı sitenin kendi header logosunu gösterdi (beyaz zemin, koyu
     yazı, mavi nokta) — bütün gradyan denemelerini bırakıp aynen onu
     ikon boyutuna taşıdık. AuthView.jsx'teki gerçek renkler: #0F1115 /
     #2563EB. */
  .wordmark { display: flex; align-items: baseline; }
  .word { color: #0F1115; font-size: 300px; font-weight: 800; letter-spacing: -9px; }
  .dot { color: #2563EB; font-size: 300px; font-weight: 800; }
</style>
</head>
<body>
  <div class="wordmark"><span class="word">İşinn</span><span class="dot">.</span></div>
</body>
</html>
