<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    background: radial-gradient(circle at 30% 22%, #1E4A2C 0%, #16321F 55%, #0F2317 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .wordmark { display: flex; align-items: baseline; }
  /* Kullanıcı geri bildirimi (2026-09-15): "yazı çok küçük, daha alımlı bir
     renk olsa iyi olurdu" — ikon boyutu tek satır metne göre ayarlanmıştı,
     gerçek masaüstü/telefon ikonu ölçeğinde küçük/donuk kalıyordu. Metin
     genişliği artık kutuyu neredeyse dolduruyor (~880px / 1024px), düz koyu
     yeşil yerine hafif bir degrade + daha canlı bir mavi nokta. */
  .word { color: #FFFFFF; font-size: 300px; font-weight: 800; letter-spacing: -9px; }
  .dot { color: #3B82F6; font-size: 300px; font-weight: 800; text-shadow: 0 0 44px rgba(59,130,246,0.65); }
</style>
</head>
<body>
  <div class="wordmark"><span class="word">İşinn</span><span class="dot">.</span></div>
</body>
</html>
