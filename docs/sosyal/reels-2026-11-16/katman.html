<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:Inter,sans-serif;position:relative}
.kanca{position:absolute;left:70px;right:150px;top:1150px;background:#F6F1E8;border-radius:28px;padding:44px 52px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.kanca h1{font-family:Fraunces,serif;font-weight:600;font-size:82px;line-height:1.08;color:#1F1A14;letter-spacing:-.01em}
.kanca h1 b{color:#2563EB;font-weight:600}
.alt{position:absolute;left:90px;right:150px;top:1220px;text-align:center}
.alt span{display:inline;background:rgba(20,17,14,.78);color:#fff;font:600 54px/1.42 Inter;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.etiket{position:absolute;left:44px;top:150px;font:500 26px/1 Inter;color:#fff;background:rgba(20,17,14,.5);padding:10px 16px;border-radius:999px}
</style>
</head>
<body>
<script>
const P=new URLSearchParams(location.search);
const tip=P.get('tip'), m=P.get('m')||'';
if(tip==='kanca') document.body.innerHTML=`<div class="kanca"><h1>${m}</h1></div>`;
else if(tip==='alt') document.body.innerHTML=`<div class="alt"><span>${m}</span></div>`;
else if(tip==='etiket') document.body.innerHTML=`<div class="etiket">Sunucu yapay zekâ avatarıdır</div>`;
</script>
</body>
</html>
