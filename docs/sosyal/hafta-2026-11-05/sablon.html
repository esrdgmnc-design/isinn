<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --krem:#F6F1E8; --kahve:#2B2118; --soluk:#7A6A58; --cizgi:#D9CDBA; --mavi:#2563EB; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:var(--w); height:var(--h); background:var(--krem); overflow:hidden; }
  body { font-family:Inter, system-ui, sans-serif; color:var(--kahve); }
  .sahne { position:relative; width:var(--w); height:var(--h); padding:96px 88px; display:flex; flex-direction:column; }
  .ust { font:500 26px/1 Inter; letter-spacing:.18em; text-transform:uppercase; color:var(--soluk); }
  h1 { font-family:Fraunces, Georgia, serif; font-weight:600; font-size:var(--h1); line-height:1.08; letter-spacing:-.01em; margin-top:36px; max-width:880px; }
  .alt { font:400 34px/1.45 Inter; color:var(--soluk); margin-top:28px; max-width:820px; }
  .telefonlar { position:relative; flex:1; margin-top:48px; }
  .tel { position:absolute; width:var(--tw); aspect-ratio:9/16; border-radius:44px; overflow:hidden; background:#fff;
         box-shadow:0 30px 60px rgba(43,33,24,.18), 0 0 0 10px #fff, 0 0 0 11px var(--cizgi); }
  .tel img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .alt-bant { display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid var(--cizgi); padding-top:28px; margin-top:auto; }
  .alt-bant .mag { font:500 28px/1.3 Inter; }
  .alt-bant .site { font:500 26px/1 Inter; color:var(--soluk); letter-spacing:.04em; }
  .marka { font-family:Fraunces, serif; font-weight:600; font-size:44px; }
  .marka i { font-style:normal; color:var(--mavi); }
  .alinti { font-family:Fraunces, serif; font-size:var(--q); line-height:1.2; font-weight:400; margin-top:auto; margin-bottom:auto; max-width:900px; }
  .imza { font:500 30px/1.4 Inter; color:var(--soluk); margin-top:40px; }
  body.koyu { --krem:#2B2118; --kahve:#F6F1E8; --soluk:#C9B89F; --cizgi:#5A4A3A; }
  body.koyu .tel { box-shadow:0 30px 70px rgba(0,0,0,.45), 0 0 0 10px #F6F1E8, 0 0 0 11px #5A4A3A; }
  body.koyu .marka i { color:#7FA6FF; }
</style>
</head>
<body>
<div class="sahne" id="s"></div>
<script>
const p = new URLSearchParams(location.search);
const d = +(p.get('d') || 1), story = p.get('s') === 'story';
const W = 1080, H = story ? 1920 : 1350;
const r = document.documentElement.style;
r.setProperty('--w', W + 'px'); r.setProperty('--h', H + 'px');
r.setProperty('--h1', story ? '104px' : '88px'); r.setProperty('--tw', story ? '520px' : '410px');
r.setProperty('--q', story ? '84px' : '72px');
const MAG = 'App Store ve Google Play’de';
const G = {
  1: { ust:'Yeni', h:'Vitrinin artık her telefonda.', a:'İşinn, App Store ve Google Play’de.', t:[['img/2_ne_yapmayi_seviyorsun.png',-4,0,0],['img/4_yetenegini_farket.png',4,1,1]] },
  2: { ust:'Yeteneğini Keşfet', h:'Ne sunabileceğini bir cümleyle bul.', a:'Gündelik yaptığın şeyleri yaz, İşinn sana hizmet fikirleri ve vitrin taslağı önersin.', t:[['img/4_yetenegini_farket.png',0,.5,0]] },
  3: { ust:'Gerçek bir deneme', h:'Senin sözlerin, ilk teklifin olur.', a:'Yazdığın cümleden, düzenleyebileceğin bir hizmet taslağına.', t:[['img/5_ornek_sonuc.png',0,.5,0]] },
  4: { alinti:'“İnsan emeği, hak ettiği yerde görünür olmalı.”', imza:'Esra Güneş · İşinn kurucusu' },
  5: { ust:'Sen hangisisin?', h:'Bildiğin iş, bir vitrinle başlar.', a:'El işinden derse, yazıdan dijitale. Önce ne yapmayı sevdiğini seç.', t:[['img/2_ne_yapmayi_seviyorsun.png',0,.5,0]] },
  6: { alinti:'“Uzmanlığın, bir satırlık unvandan fazlası.”', imza:'Vitrininde çalışmalarını, yaklaşımını ve tarzını göster.' },
  8: { koyu:1, ust:'Esra Güneş · Kurucu', h:'Emek verdiğim İşinn, artık iki mağazada da.', a:'App Store ve Google Play’de. Vitrinini aç, işini göster.', t:[['img/4_yetenegini_farket.png',-3,0,0],['img/5_ornek_sonuc.png',3,1,1]] },
  7: { ust:'İşin gücün burada', h:'Vitrinini aç, arayan seni bulsun.', a:'Arayanla doğrudan konuş. Anlaşmayı taraflar kendi arasında yapar.', t:[['img/1_karsilama_temiz.png',0,.5,0]] },
};
const g = G[d], s = document.getElementById('s');
if (g.koyu) document.body.classList.add('koyu');
let html = `<div class="ust">${g.ust || 'İşinn'}</div>`;
if (g.alinti) {
  html += `<div class="alinti">${g.alinti}<div class="imza">${g.imza}</div></div>`;
} else {
  html += `<h1>${g.h}</h1><div class="alt">${g.a}</div><div class="telefonlar">`;
  for (const [src, rot, pos, ofs, mode] of g.t) {
    const n = g.t.length, tw = story ? (n === 1 ? 560 : 470) : (n === 1 ? 320 : 290);
    const left = n === 1 ? (W - 176 - tw) / 2 : (ofs ? (W - 176) / 2 - 20 : (W - 176) / 2 - tw + 20);
    const top = n === 1 ? 0 : (ofs ? 60 : 0);
    const fit = mode === 'crop' ? 'object-position:center 22%;transform:scale(1.35);transform-origin:center 30%' : '';
    html += `<div class="tel" style="width:${tw}px;left:${left}px;top:${top}px;transform:rotate(${rot}deg)"><img src="${src}" style="${fit}"></div>`;
  }
  html += `</div>`;
}
html += `<div class="alt-bant"><div><div class="marka">İşinn<i>.</i></div><div class="mag">${MAG}</div></div><div class="site">isinn.com.tr</div></div>`;
s.innerHTML = html;
</script>
</body>
</html>
