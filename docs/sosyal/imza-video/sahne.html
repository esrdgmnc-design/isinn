<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#F6F1E8; overflow:hidden; }
  body { font-family:Inter, system-ui, sans-serif; color:#1F1A14; }
  .sahne { position:relative; display:flex; flex-direction:column; }
  .bant { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #D9CDBA; padding-bottom:22px; }
  .marka { font-family:Fraunces, serif; font-weight:600; font-size:40px; }
  .marka i { font-style:normal; color:#2563EB; }
  .motto-k { font:500 26px/1 Inter; color:#6E5F4E; letter-spacing:.02em; }
  .adim { font:600 24px/1 Inter; letter-spacing:.2em; color:#2563EB; text-transform:uppercase; }
  h1 { font-family:Fraunces, Georgia, serif; font-weight:600; line-height:1.08; letter-spacing:-.01em; }
  .kart { background:#fff; border-radius:36px; overflow:hidden; box-shadow:0 30px 70px rgba(43,33,24,.14), 0 0 0 1px #E6DCCB; }
  .kart img { display:block; width:100%; }
  .kapanis h1 { color:#1F1A14; }
  .kapanis .alt { font:400 34px/1.45 Inter; color:#6E5F4E; }
  .site { font:500 30px/1 Inter; color:#6E5F4E; }
  .mag { font:500 28px/1.3 Inter; color:#1F1A14; }
</style>
</head>
<body>
<div class="sahne" id="s"></div>
<script>
const p = new URLSearchParams(location.search);
const n = +(p.get('n') || 1), f = p.get('f') || 'dikey';
const OL = { dikey:[1080,1920], kare:[1080,1350], yatay:[1920,1080] }[f];
const [W, H] = OL;
document.documentElement.style.cssText = `width:${W}px;height:${H}px`;
const s = document.getElementById('s');
s.style.cssText = `width:${W}px;height:${H}px;padding:${f==='yatay'?'72px 110px':'90px 80px'}`;
const MOTTO = 'İşini göster, uzmanını bul.';
const S = {
  1: ['1 · Vitrin', 'Uzmanlar İşinn’de vitrin açar.', 'ekran/k1_vitrin.png'],
  2: ['2 · Çalışmalar', 'İşini ve çalışma örneklerini gösterir.', 'ekran/k2_ornekler.png'],
  3: ['3 · Arama', 'İhtiyacı olan, doğru uzmanı bulur.', 'ekran/k3_arama.png'],
  4: ['4 · Mesaj', 'Doğrudan mesajlaşırlar.', 'ekran/k4_mesaj.png'],
};
const bant = `<div class="bant"><div class="marka">İşinn<i>.</i></div><div class="motto-k">${MOTTO}</div></div>`;
const h1 = { dikey:96, kare:76, yatay:84 }[f];
if (n <= 4) {
  const [adim, cumle, img] = S[n];
  if (f === 'yatay') {
    s.innerHTML = bant + `<div style="flex:1;display:flex;align-items:center;gap:90px;margin-top:40px">
      <div style="flex:0 0 640px"><div class="adim">${adim}</div><h1 style="font-size:${h1}px;margin-top:28px">${cumle}</h1></div>
      <div style="flex:1;display:flex;justify-content:center"><div class="kart" style="max-width:860px;max-height:820px"><img src="${img}" style="max-height:820px;object-fit:cover;object-position:top"></div></div></div>`;
  } else {
    const maxH = f === 'dikey' ? 1180 : 700;
    s.innerHTML = bant + `<div class="adim" style="margin-top:${f==='dikey'?80:50}px">${adim}</div>
      <h1 style="font-size:${h1}px;margin-top:24px;max-width:900px">${cumle}</h1>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;margin-top:40px">
        <div class="kart" style="width:100%;max-height:${maxH}px"><img src="${img}" style="max-height:${maxH}px;object-fit:cover;object-position:top"></div></div>`;
  }
} else {
  const big = { dikey:120, kare:100, yatay:112 }[f];
  s.classList.add('kapanis');
  s.innerHTML = `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;${f==='yatay'?'align-items:center;text-align:center':''}">
    <div class="marka" style="font-size:${f==='yatay'?64:72}px">İşinn<i>.</i></div>
    <h1 style="font-size:${big}px;margin-top:40px;max-width:${f==='yatay'?1500:920}px">${MOTTO}</h1>
    <div class="alt" style="margin-top:34px;max-width:${f==='yatay'?1200:880}px">Uzmanlar vitrin açıp işini gösterir; sen doğru kişiyi bulup doğrudan yazarsın.</div></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #D9CDBA;padding-top:28px">
      <div class="mag">Web’de, App Store ve Google Play’de</div><div class="site">isinn.com.tr</div></div>`;
}
</script>
</body>
</html>
