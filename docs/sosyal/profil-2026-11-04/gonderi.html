<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#F6F1E8; }
  body { font-family:Inter, sans-serif; color:#14110D; }
  .s { width:1080px; height:1350px; padding:96px 88px 80px; display:flex; flex-direction:column; }
  .ust { display:flex; justify-content:space-between; align-items:center; }
  .marka { font-family:Fraunces, serif; font-weight:700; font-size:46px; }
  .marka i { font-style:normal; color:#2563EB; }
  .etiket { font:600 22px/1 Inter; letter-spacing:.18em; text-transform:uppercase; color:#2563EB; }
  h1 { font-family:Fraunces, serif; font-weight:700; letter-spacing:-.015em; line-height:1.06; }
  .mavi { color:#2563EB; }
  .alt { font:500 34px/1.4 Inter; color:#5B4E40; }
  .kart { background:#fff; border-radius:32px; overflow:hidden; box-shadow:0 24px 60px rgba(20,17,13,.12), 0 0 0 1px #E4D9C7; }
  .kart img { width:100%; display:block; }
  .adim { display:flex; gap:34px; align-items:flex-start; padding:34px 0; border-top:1px solid #DDD1BE; }
  .no { flex:0 0 84px; height:84px; border-radius:50%; background:#2563EB; color:#fff; font:700 40px/84px Inter; text-align:center; }
  .adim b { display:block; font:700 42px/1.2 Inter; }
  .adim span { display:block; font:400 30px/1.4 Inter; color:#5B4E40; margin-top:8px; }
  .alt-bant { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid #DDD1BE; padding-top:26px; font:600 28px/1.3 Inter; }
  .alt-bant .site { color:#5B4E40; font-weight:500; }
</style>
</head>
<body><div class="s" id="s"></div>
<script>
const n = +(new URLSearchParams(location.search).get('n') || 1);
const ust = `<div class="ust"><div class="marka">İşinn<i>.</i></div><div class="etiket">isinn.com.tr</div></div>`;
const bant = `<div class="alt-bant"><div>App Store ve Google Play’de</div><div class="site">isinn.com.tr</div></div>`;
const P = {
  1: ust + `<div style="margin:auto 0">
      <h1 style="font-size:92px">Freelance bir uzman bulmak istediğinizde aklınıza <span class="mavi">yerli bir uygulama</span> geliyor mu?</h1>
      <h1 style="font-size:92px;margin-top:56px">Bundan sonra cevabınız: <span class="mavi">evet.</span></h1></div>` + bant,
  2: ust + `<div class="etiket" style="margin-top:70px">Nasıl çalışır?</div>
      <h1 style="font-size:76px;margin-top:22px;margin-bottom:40px">Üç adımda doğru uzman.</h1>
      <div class="adim"><div class="no">1</div><div><b>Uzman vitrin açar.</b><span>Yaptığı işi, çalışma örneklerini ve yaklaşımını gösterir.</span></div></div>
      <div class="adim"><div class="no">2</div><div><b>Sen doğru kişiyi bulursun.</b><span>Hizmeti ve şehri yaz, vitrinleri incele.</span></div></div>
      <div class="adim"><div class="no">3</div><div><b>Doğrudan mesajlaşırsınız.</b><span>Anlaşmayı taraflar kendi arasında yapar.</span></div></div>` + bant,
  3: ust + `<h1 style="font-size:80px;margin-top:64px">Türkiye’nin freelance iş ve hizmet bulma platformu.</h1>
      <div class="alt" style="margin-top:26px">Artık App Store ve Google Play’de.</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center;margin-top:36px">
        <div class="kart" style="padding:26px 22px"><img src="img/kesfet.png"></div><div class="alt" style="font-size:30px;margin-top:6px">Tasarımcıdan yazılımcıya, öğretmenden danışmana: farklı alanlardan uzmanlar tek yerde.</div>
        </div>` + bant,
};
document.getElementById('s').innerHTML = P[n];
</script></body></html>
