<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayora — Atölye kilidi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E5770}a:hover{color:#56718C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F0EDE6; font-family: 'Jost', sans-serif; font-weight: 300; color: #26303A; box-sizing: border-box;">
  <div style="padding: 36px 28px 0; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <a href="Atolyeler.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 10.5px; letter-spacing: 0.3em; text-decoration: none; color: #5D6A77;">← ATÖLYELER</a>
    <div style="margin-top: 14px; width: 190px; height: 240px; border-radius: 95px 95px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 34px; box-sizing: border-box; background: linear-gradient(160deg, rgba(255,250,238,0.9), rgba(228,229,226,0.7) 60%, rgba(216,223,229,0.6)); box-shadow: inset 0 10px 30px rgba(62,87,112,0.14); outline: 1px solid rgba(94,122,152,0.28); outline-offset: 8px;">
      <div style="width: 64px; height: 64px; border-radius: 32px; border: 1px solid #5E7A98; display: flex; align-items: center; justify-content: center; color: #3E5770;">
        <sc-if value="{{locked}}" hint-placeholder-val="{{true}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        </sc-if>
        <sc-if value="{{bought}}" hint-placeholder-val="{{false}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </sc-if>
      </div>
      <span style="margin-top: 14px; font-size: 10px; letter-spacing: 0.26em; color: #4F6A85;">1 SA · VİDEO + SES</span>
    </div>
    <h1 style="margin: 30px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 38px; line-height: 1; color: #3E5770;">Manifest Atölyesi</h1>
    <div style="margin-top: 8px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: #5D6A77;">Hamide Değirmenci</div>
    <p style="margin: 14px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 17px; line-height: 1.5; color: #5D6A77;">[Atölye açıklaması — Hamide yazacak]</p>
    <div style="width: 100%; margin-top: 14px; display: flex; flex-direction: column; text-align: left;">
      <div style="padding: 11px 0; border-top: 1px solid rgba(94,122,152,0.28); font-family: 'Cormorant Garamond', serif; font-size: 19px;">Video olarak izle</div>
      <div style="padding: 11px 0; border-top: 1px solid rgba(94,122,152,0.28); font-family: 'Cormorant Garamond', serif; font-size: 19px;">Ekran kapalıyken ses olarak dinle</div>
      <div style="padding: 11px 0; border-top: 1px solid rgba(94,122,152,0.28); border-bottom: 1px solid rgba(94,122,152,0.28); font-family: 'Cormorant Garamond', serif; font-size: 19px;">Bir kez al, hesabında kalsın</div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 28px 26px; background: linear-gradient(rgba(240,237,230,0), #F0EDE6 35%); display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <sc-if value="{{locked}}" hint-placeholder-val="{{true}}">
      <button onClick="{{buy}}" style="width: 100%; min-height: 50px; background: #3E5770; border: 1px solid #3E5770; color: #F7F0E6; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.28em;">KİLİDİ AÇ</button>
      <span style="font-size: 11.5px; color: #5D6A77;">Ödeme App Store / Google Play üzerinden alınır.</span>
    </sc-if>
    <sc-if value="{{bought}}" hint-placeholder-val="{{false}}">
      <button onClick="{{reset}}" style="width: 100%; min-height: 50px; background: #3E5770; border: 1px solid #3E5770; color: #F7F0E6; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.28em;">İZLEMEYE BAŞLA</button>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #5D6A77;">Kilit açıldı. Bu kayıt artık sende.</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { bought: false }; }
renderVals() {
const b = this.state.bought;
return {
locked: !b,
bought: b,
buy: () => this.setState({ bought: true }),
reset: () => this.setState({ bought: false })
};
}
}
</script>
</body>
</html>
