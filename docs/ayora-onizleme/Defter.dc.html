<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayora — Niyet ve Şükür Defteri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E5770}a:hover{color:#56718C}
textarea::placeholder{color:#5D6A77;font-style:italic}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F0EDE6; font-family: 'Jost', sans-serif; font-weight: 300; color: #26303A; box-sizing: border-box;">
  <div style="padding: 36px 28px 0; display: flex; flex-direction: column;">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
      <div aria-hidden="true" style="width: 30px; height: 38px; border: 1px solid #7F98B2; border-bottom: none; border-radius: 15px 15px 0 0; box-sizing: border-box; padding: 4px 4px 0;"><div style="width: 100%; height: 100%; border: 1px solid rgba(94,122,152,0.28); border-bottom: none; border-radius: 11px 11px 0 0; box-sizing: border-box;"></div></div>
      <h1 style="margin: 10px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 42px; line-height: 1; color: #3E5770;">Defterim</h1>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #5D6A77;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-label="Kilitli" role="img"><rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        Bu ay 14 gün yazdın
      </div>
      <div style="display: flex; gap: 28px; margin-top: 6px;">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
        </sc-for>
        <a href="Pano.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; border-bottom: 1px solid transparent; color: #5D6A77; font-size: 11px; letter-spacing: 0.28em; text-decoration: none; box-sizing: border-box;">PANO</a>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-top: 10px; text-align: center;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button onClick="{{d.pick}}" aria-label="{{d.label}}" style="min-height: 52px; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: Jost, sans-serif;">
          <span style="font-size: 10px; letter-spacing: 0.16em; color: #5D6A77;">{{d.name}}</span>
          <span style="{{d.numStyle}}">{{d.num}}</span>
          <span style="{{d.dot}}"></span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{isToday}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 8px; background: #F7F0E6; border: 1px solid rgba(94,122,152,0.28); border-radius: 60px 60px 6px 6px; padding: 30px 22px 18px; display: flex; flex-direction: column; box-shadow: 0 18px 30px -24px rgba(62,87,112,0.45);">
        <span style="font-size: 10.5px; letter-spacing: 0.32em; color: #4F6A85; text-align: center;">22 KASIM · PAZAR</span>
        <label for="yazi" style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 20px; color: #3E5770; text-align: center; margin-top: 6px;">{{prompt}}</label>
        <textarea id="yazi" rows="4" placeholder="{{placeholder}}" style="margin-top: 6px; width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 1px solid rgba(94,122,152,0.28); font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 22px; line-height: 1.5; color: #26303A; resize: none; padding: 6px 0; outline: none;"></textarea>
        <div style="display: flex; gap: 24px; align-items: center; margin-top: 18px; flex-wrap: wrap;">
          <button onClick="{{save}}" style="min-height: 46px; padding: 0 26px; background: none; border: 1px solid #5E7A98; color: #3E5770; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.28em;">{{saveLabel}}</button>
          <button onClick="{{look}}" style="min-height: 44px; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(94,122,152,0.28); color: #5D6A77; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.24em;">BİRLİKTE BAKALIM</button>
        </div>
        <sc-if value="{{showReflect}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(94,122,152,0.28);">
            <span style="font-size: 10.5px; letter-spacing: 0.32em; color: #4F6A85;">HAMİDE'DEN BİR SORU</span>
            <p style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 19px; line-height: 1.55; color: #26303A;">{{reflect}}</p>
          </div>
        </sc-if>
      </div>
    </sc-if>
    <sc-if value="{{isPast}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 8px; background: #F7F0E6; border: 1px solid rgba(94,122,152,0.28); border-radius: 60px 60px 6px 6px; padding: 30px 22px 22px; text-align: center; box-shadow: 0 18px 30px -24px rgba(62,87,112,0.45);">
        <span style="font-size: 10.5px; letter-spacing: 0.32em; color: #4F6A85;">{{pastDate}}</span>
        <p style="margin: 12px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 22px; line-height: 1.5; color: #26303A;">{{pastText}}</p>
        <button onClick="{{backToday}}" style="margin-top: 14px; min-height: 44px; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(94,122,152,0.28); color: #5D6A77; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.24em;">BUGÜNE DÖN</button>
      </div>
    </sc-if>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
      <button style="min-height: 44px; padding: 0; background: none; border: none; color: #5D6A77; font-family: Jost, sans-serif; font-size: 10px; letter-spacing: 0.22em; text-align: left;">HATIRLATMA · 08.00 / 21.00</button>
      <button style="min-height: 44px; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(94,122,152,0.28); color: #5D6A77; font-family: Jost, sans-serif; font-size: 10px; letter-spacing: 0.22em;">YEDEK AL</button>
    </div>
  </div>
  <nav aria-label="Ana menü" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 10px 18px; background: linear-gradient(rgba(240,237,230,0), #F0EDE6 45%); display: flex; justify-content: center; gap: 18px;">
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #5D6A77; border-bottom: 1px solid transparent; box-sizing: border-box;">BUGÜN</a>
    <a href="Defter.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #3E5770; border-bottom: 1px solid #7F98B2; box-sizing: border-box;">DEFTER</a>
    <a href="Dinle.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #5D6A77; border-bottom: 1px solid transparent; box-sizing: border-box;">DİNLE VE OKU</a>
    <a href="Atolyeler.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #5D6A77; border-bottom: 1px solid transparent; box-sizing: border-box;">ATÖLYE</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { mode: 'niyet', reflect: false, saved: false, sel: 6 }; }
renderVals() {
const s = this.state;
const niyet = s.mode === 'niyet';
const modeOn = 'min-height: 44px; background: none; border: none; border-bottom: 1px solid #3E5770; padding: 0 2px; color: #3E5770; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.28em;';
const modeOff = 'min-height: 44px; background: none; border: none; border-bottom: 1px solid transparent; padding: 0 2px; color: #5D6A77; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.28em;';
const names = ['PT', 'SA', 'ÇA', 'PE', 'CU', 'CT', 'PZ'];
const nums = [16, 17, 18, 19, 20, 21, 22];
const niyetler = [
'Bu hafta kendime karşı sabırlı olmaya niyet ediyorum.',
'Yorulduğumda dinlenmeye izin vermeye niyet ediyorum.',
'O konuşmayı sakin bir kalple yapmaya niyet ediyorum.',
'',
'Ertelediğim yürüyüşe çıkmaya niyet ediyorum.',
'Kendime karşı daha yumuşak olmaya niyet ediyorum.',
''
];
const sukurler = [
'Sabah güneşi, sıcak bir çorba, kızımın gülüşü.',
'Erken uyanmak, sessiz bir kahve.',
'Bir dostun beklenmedik mesajı.',
'',
'Yağmurdan sonra toprağın kokusu.',
'Sabah çayı, annemin sesi, akşam serinliği.',
''
];
const texts = niyet ? niyetler : sukurler;
const dot = (on) => 'width: 4px; height: 4px; border-radius: 2px; background: ' + (on ? '#5E7A98' : 'transparent') + ';';
const numBase = 'width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 13px; box-sizing: border-box;';
const isToday = s.sel === 6;
const monthNames = 'KASIM';
return {
modes: [
{ label: 'NİYET', style: niyet ? modeOn : modeOff, pick: () => this.setState({ mode: 'niyet', reflect: false, saved: false }) },
{ label: 'ŞÜKÜR', style: !niyet ? modeOn : modeOff, pick: () => this.setState({ mode: 'sukur', reflect: false, saved: false }) }
],
days: names.map((n, i) => ({
name: n, num: nums[i], label: nums[i] + ' Kasım',
numStyle: numBase + (i === s.sel ? ' border: 1px solid #3E5770; color: #3E5770;' : ' color: #26303A;'),
dot: dot(!!texts[i]),
pick: () => this.setState({ sel: i, reflect: false })
})),
isToday: isToday,
isPast: !isToday,
pastDate: nums[s.sel] + ' ' + monthNames,
pastText: texts[s.sel] || 'Bu gün bir şey yazmamışsın. Sorun değil.',
backToday: () => this.setState({ sel: 6 }),
prompt: niyet ? 'Bugün neye niyet ediyorsun?' : 'Bugün neye minnettarsın?',
placeholder: niyet ? 'Bugün…' : 'Bugün minnettarım çünkü…',
save: () => this.setState({ saved: true }),
saveLabel: s.saved ? 'KAYDEDİLDİ' : 'KAYDET',
look: () => this.setState({ reflect: !s.reflect }),
showReflect: s.reflect,
reflect: niyet
? 'Bu niyet gerçekleştiğinde kendini nasıl hissedeceksin? Bugün ona doğru atabileceğin en küçük adım ne?'
: 'Bu şeylerden hangisi sana en çok dokundu? Bu hissi bugün kiminle paylaşabilirsin?'
};
}
}
</script>
</body>
</html>
