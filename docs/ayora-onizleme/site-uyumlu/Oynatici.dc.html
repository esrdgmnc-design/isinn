<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayora — Oynatıcı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Rubik:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#2D5661}a:hover{color:#1F3F48}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Rubik', sans-serif; font-weight: 300; color: #1E2A2E; box-sizing: border-box; padding: 34px 24px 40px; display: flex; flex-direction: column; align-items: center;">
  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;">
    <a href="Kesfet.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #BBD1D7; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D5661" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 11px; letter-spacing: 0.18em; font-weight: 500; color: #2D5661;">MEDİTASYON</span>
    <button aria-label="Favorilere ekle" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #BBD1D7; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D5661" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
  </div>
  <div style="margin-top: 34px; width: 264px; height: 264px; border-radius: 50%; border: 1px solid #2D5661; padding: 12px; box-sizing: border-box;">
    <img src="img/s4.jpg" alt="Meditasyon" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;">
  </div>
  <h1 style="margin: 30px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 32px; letter-spacing: 0.04em; color: #2D5661;">SABAH NEFESİ</h1>
  <span style="font-size: 14px; color: #3D4F55; margin-top: 4px;">Hamide Değirmenci</span>
  <div style="width: 100%; margin-top: 28px;">
    <div style="height: 2px; background: #E3ECEE; position: relative; border-radius: 1px;">
      <div style="width: 32%; height: 2px; background: #2D5661; border-radius: 1px;"></div>
      <div style="position: absolute; left: 32%; top: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: #2D5661;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #3D4F55;"><span>03:12</span><span>10:00</span></div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 18px;">
    <button aria-label="15 saniye geri" style="width: 48px; height: 48px; border: none; background: none; color: #2D5661; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Rubik, sans-serif; font-size: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg>15
    </button>
    <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 84px; height: 84px; border-radius: 42px; border: none; background: #2D5661; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;">
      <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      </sc-if>
    </button>
    <button aria-label="15 saniye ileri" style="width: 48px; height: 48px; border: none; background: none; color: #2D5661; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Rubik, sans-serif; font-size: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"></path></svg>15
    </button>
  </div>
  <div style="display: flex; gap: 10px; margin-top: 22px;">
    <button style="min-height: 42px; padding: 0 18px; border-radius: 21px; border: 1px solid #2D5661; background: #FFFFFF; color: #2D5661; font-family: Rubik, sans-serif; font-size: 13px;">Uyku zamanlayıcı</button>
    <button style="min-height: 42px; padding: 0 18px; border-radius: 21px; border: 1px solid #2D5661; background: #FFFFFF; color: #2D5661; font-family: Rubik, sans-serif; font-size: 13px;">İndirildi ✓</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { playing: true }; }
renderVals() {
const playing = this.state.playing;
return { playing: playing, paused: !playing, playLabel: playing ? 'Duraklat' : 'Oynat', toggle: () => this.setState({ playing: !playing }) };
}
}
</script>
</body>
</html>
