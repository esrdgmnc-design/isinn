<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayora — Defterim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Rubik:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#2D5661}a:hover{color:#1F3F48}textarea::placeholder,input::placeholder{color:#5C6F75;font-style:italic}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Rubik', sans-serif; font-weight: 300; color: #1E2A2E; box-sizing: border-box;">
  <div style="padding: 34px 24px 100px; display: flex; flex-direction: column; gap: 16px;">
    <div style="text-align: center;">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 32px; letter-spacing: 0.04em; color: #2D5661;">DEFTERİM</h1>
      <span style="font-size: 13px; color: #3D4F55;">12 gündür her gün yazıyorsun</span>
    </div>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
      <a href="Pano.dc.html" style="min-height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid #2D5661; color: #2D5661; font-size: 14px; font-weight: 400; text-decoration: none; display: flex; align-items: center; box-sizing: border-box;">Pano</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #5C6F75;">{{d.name}}</span>
          <span style="{{d.style}}">{{d.num}}</span>
        </div>
      </sc-for>
    </div>
    <div style="background: #F3F7F8; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 11px; letter-spacing: 0.18em; font-weight: 500; color: #2D5661;">21 KASIM · CUMARTESİ</span>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 24px; line-height: 1.2;">{{prompt}}</span>
      <sc-if value="{{isNiyet}}" hint-placeholder-val="{{true}}">
        <label for="niyet" style="position: absolute; left: -9999px;">Niyetin</label>
        <textarea id="niyet" rows="3" placeholder="Bugün…" style="width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 1px solid #BBD1D7; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 20px; line-height: 1.5; color: #1E2A2E; resize: none; padding: 4px 0; outline: none;"></textarea>
      </sc-if>
      <sc-if value="{{isSukur}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px;">
            <label for="{{l.id}}" style="width: 26px; height: 26px; border-radius: 13px; border: 1px solid #2D5661; color: #2D5661; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box;">{{l.n}}</label>
            <input id="{{l.id}}" type="text" placeholder="{{l.ph}}" style="flex-grow: 1; min-height: 44px; border: none; border-bottom: 1px solid #BBD1D7; background: transparent; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 19px; color: #1E2A2E; outline: none;">
          </div>
        </sc-for>
      </sc-if>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;">
        <sc-for list="{{feelings}}" as="f" hint-placeholder-count="5">
          <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
        <button onClick="{{look}}" style="min-height: 44px; background: none; border: none; padding: 0; border-bottom: 1px solid #2D5661; color: #2D5661; font-family: Rubik, sans-serif; font-size: 13px;">Birlikte bakalım</button>
        <button onClick="{{save}}" style="min-height: 44px; padding: 0 26px; border-radius: 22px; border: none; background: #2D5661; color: #FFFFFF; font-family: Rubik, sans-serif; font-size: 14px;">{{saveLabel}}</button>
      </div>
      <sc-if value="{{showReflect}}" hint-placeholder-val="{{false}}">
        <div style="border-top: 1px solid #BBD1D7; padding-top: 12px;">
          <span style="font-size: 11px; letter-spacing: 0.18em; font-weight: 500; color: #2D5661;">HAMİDE'DEN BİR SORU</span>
          <p style="margin: 6px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 19px; line-height: 1.4;">{{reflect}}</p>
        </div>
      </sc-if>
    </div>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 11px; letter-spacing: 0.18em; font-weight: 500; color: #2D5661; padding-bottom: 6px;">GEÇMİŞ</span>
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="2">
        <div style="padding: 10px 0; border-top: 1px solid #E3ECEE; display: flex; gap: 12px;">
          <span style="font-size: 12px; color: #5C6F75; width: 52px; flex-shrink: 0; padding-top: 3px;">{{e.date}}</span>
          <span style="display: flex; flex-direction: column;">
            <span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 18px; line-height: 1.35;">{{e.text}}</span>
            <span style="font-size: 12px; color: #2D5661;">{{e.feel}}</span>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Ana menü" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E3ECEE; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; font-size: 11px; text-decoration: none; color: #5C6F75;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Bugün</a>
    <a href="Defter.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; font-size: 11px; font-weight: 500; text-decoration: none; color: #2D5661;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Defter</a>
    <a href="Kesfet.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; font-size: 11px; text-decoration: none; color: #5C6F75;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>Keşfet</a>
    <a href="Atolyeler.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; font-size: 11px; text-decoration: none; color: #5C6F75;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9.5v5l4-2.5z"></path></svg>Atölyeler</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { mode: 'niyet', feel: 'huzurlu', reflect: false, saved: false }; }
renderVals() {
const s = this.state;
const niyet = s.mode === 'niyet';
const pillOn = 'min-height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid #2D5661; background: #2D5661; color: #FFFFFF; font-family: Rubik, sans-serif; font-size: 14px;';
const pillOff = 'min-height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid #2D5661; background: #FFFFFF; color: #2D5661; font-family: Rubik, sans-serif; font-size: 14px;';
const fOn = 'min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2D5661; background: #2D5661; color: #FFFFFF; font-family: Rubik, sans-serif; font-size: 12px;';
const fOff = 'min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #BBD1D7; background: #FFFFFF; color: #2D5661; font-family: Rubik, sans-serif; font-size: 12px;';
const dayBase = 'width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 13px; box-sizing: border-box;';
const names = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
const nums = [15, 16, 17, 18, 19, 20, 21];
const done = [true, true, true, true, true, true, false];
const feelings = ['huzurlu', 'minnettar', 'umutlu', 'yorgun', 'hafif'];
return {
tabs: [
{ label: 'Niyet', style: niyet ? pillOn : pillOff, pick: () => this.setState({ mode: 'niyet', reflect: false, saved: false }) },
{ label: 'Şükür', style: !niyet ? pillOn : pillOff, pick: () => this.setState({ mode: 'sukur', reflect: false, saved: false }) }
],
days: names.map((n, i) => ({
name: n, num: nums[i],
style: dayBase + (i === 6 ? ' border: 1px solid #2D5661; color: #2D5661; font-weight: 500;' : done[i] ? ' background: #2D5661; color: #FFFFFF;' : ' color: #3D4F55;')
})),
isNiyet: niyet, isSukur: !niyet,
prompt: niyet ? 'Bugün neye niyet ediyorsun?' : 'Bugün minnettar olduğun 3 şey',
lines: [
{ id: 's1', n: '1', ph: 'Sabah kahvem…' },
{ id: 's2', n: '2', ph: '…' },
{ id: 's3', n: '3', ph: '…' }
],
feelings: feelings.map((f) => ({ label: f, style: f === s.feel ? fOn : fOff, pick: () => this.setState({ feel: f }) })),
save: () => this.setState({ saved: true }),
saveLabel: s.saved ? 'Kaydedildi' : 'Kaydet',
look: () => this.setState({ reflect: !s.reflect }),
showReflect: s.reflect,
reflect: niyet
? 'Bu niyet gerçekleştiğinde nasıl hissedeceksin? Bugün ona doğru atabileceğin en küçük adım ne?'
: 'Bunlardan hangisi sana en çok dokundu? Bu hissi bugün kiminle paylaşabilirsin?',
entries: niyet
? [{ date: '20 Kas', text: 'Kendime karşı daha yumuşak olmaya niyet ediyorum.', feel: 'umutlu' }, { date: '19 Kas', text: 'O konuşmayı sakin bir kalple yapmaya niyet ediyorum.', feel: 'huzurlu' }]
: [{ date: '20 Kas', text: 'Sabah çayı, annemin sesi, akşam serinliği.', feel: 'minnettar' }, { date: '19 Kas', text: 'Bir dostun beklenmedik mesajı.', feel: 'hafif' }]
};
}
}
</script>
</body>
</html>
