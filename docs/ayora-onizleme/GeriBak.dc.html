<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayora — Niyetlerine geri bak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E5770}a:hover{color:#56718C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F0EDE6; font-family: 'Jost', sans-serif; font-weight: 300; color: #26303A; box-sizing: border-box;">
  <div style="padding: 36px 28px 0; display: flex; flex-direction: column;">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
      <div aria-hidden="true" style="width: 30px; height: 38px; border: 1px solid #7F98B2; border-bottom: none; border-radius: 15px 15px 0 0; box-sizing: border-box; padding: 4px 4px 0;"><div style="width: 100%; height: 100%; border: 1px solid rgba(94,122,152,0.28); border-bottom: none; border-radius: 11px 11px 0 0; box-sizing: border-box;"></div></div>
      <span style="margin-top: 10px; font-size: 10.5px; letter-spacing: 0.32em; color: #4F6A85;">1 ARALIK · AY BAŞI</span>
      <h1 style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 38px; line-height: 1.05; color: #3E5770;">Kasım niyetlerin</h1>
      <p style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 17px; color: #5D6A77;">Bir ay önce neye niyet etmiştin? Her birine nazikçe bak.</p>
    </div>
    <div style="margin-top: 18px; display: flex; flex-direction: column;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <div style="{{it.row}}">
          <p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 19px; line-height: 1.4; color: #26303A;">{{it.text}}</p>
          <div style="display: flex; gap: 18px; margin-top: 4px;">
            <sc-for list="{{it.opts}}" as="o" hint-placeholder-count="3">
              <button onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 18px; gap: 8px;">
      <button style="min-height: 46px; padding: 0 26px; background: none; border: 1px solid #5E7A98; color: #3E5770; font-family: Jost, sans-serif; font-size: 11px; letter-spacing: 0.28em;">ARALIK'A NİYET ET</button>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #5D6A77;">Kasım'da 14 gün yazdın.</span>
    </div>
  </div>
  <nav aria-label="Ana menü" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 10px 18px; background: linear-gradient(rgba(240,237,230,0), #F0EDE6 45%); display: flex; justify-content: center; gap: 18px;">
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #5D6A77; border-bottom: 1px solid transparent; box-sizing: border-box;">BUGÜN</a>
    <a href="Defter.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #3E5770; border-bottom: 1px solid #7F98B2; box-sizing: border-box;">DEFTER</a>
    <a href="Dinle.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #5D6A77; border-bottom: 1px solid transparent; box-sizing: border-box;">DİNLE VE OKU</a>
    <a href="Atolyeler.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 2px; font-size: 10px; letter-spacing: 0.24em; text-decoration: none; color: #5D6A77; border-bottom: 1px solid transparent; box-sizing: border-box;">ATÖLYE</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { picks: { 0: 'gerçekleşti', 1: 'sürüyor' } }; }
renderVals() {
const picks = this.state.picks;
const on = 'min-height: 36px; background: none; border: none; border-bottom: 1px solid #56718C; padding: 0; color: #3E5770; font-family: Jost, sans-serif; font-size: 13px; letter-spacing: 0.04em;';
const off = 'min-height: 36px; background: none; border: none; border-bottom: 1px solid transparent; padding: 0; color: #5D6A77; font-family: Jost, sans-serif; font-size: 13px; letter-spacing: 0.04em;';
const row = 'padding: 12px 0; border-bottom: 1px solid rgba(94,122,152,0.28);';
const list = [
'Ertelediğim yürüyüşe çıkmaya niyet ediyorum.',
'Kendime karşı daha yumuşak olmaya niyet ediyorum.',
'O konuşmayı sakin bir kalple yapmaya niyet ediyorum.',
'Her sabah beş dakika nefesime dönmeye niyet ediyorum.'
];
const opts = ['gerçekleşti', 'sürüyor', 'bıraktım'];
return {
items: list.map((t, i) => ({
text: t,
row: i === 0 ? row + ' border-top: 1px solid rgba(94,122,152,0.28);' : row,
opts: opts.map((o) => ({
label: o,
style: picks[i] === o ? on : off,
pick: () => { const p = Object.assign({}, this.state.picks); p[i] = o; this.setState({ picks: p }); }
}))
}))
};
}
}
</script>
</body>
</html>
