# İşinn — Capacitor mobil uygulama, bulut derleme (Codemagic).
#
# Bu app "hosted web app" modunda çalışıyor — capacitor.config.json'daki
# server.url zaten https://www.isinn.com.tr'yi gösteriyor, yani native kabuk
# gerçek, canlı siteyi açıyor. Statik export YOK çünkü Next.js API route'ları
# (ödeme, OTP, Claude, cron) server tarafında çalışmak zorunda — bunlar zaten
# Vercel'de canlı. Bu dosya sadece native ANDROID/iOS PAKETİNİ (APK/IPA)
# derliyor, web kodunu değil.
#
# NEDEN WINDOWS'TAN DEĞİL DE BURADAN: iOS derlemesi Apple'ın kuralı gereği
# sadece Mac'te (ya da bulut Mac'inde, tam olarak burası) yapılabiliyor.
# Android teknik olarak Windows'tan da derlenebilir ama bu bilgisayarda henüz
# Android Studio/JDK kurulu değil — o yüzden ikisini de buradan, tek yerden
# yönetmek en pratik yol.
#
# KURULUM (bir kereye mahsus, sen yapman gerekiyor):
#   1. codemagic.io'da ücretsiz hesap aç, bu GitHub reposunu bağla.
#   2. Codemagic bu dosyayı otomatik bulur — "Start new build" demen yeterli.
#   3. Aşağıdaki iki iş akışı (android-debug, ios-debug) İMZASIZ, test
#      amaçlı paketler üretir — telefonuna kurup deneyebilirsin ama Play
#      Store/App Store'a YÜKLENEMEZ. Gerçek mağaza yüklemesi için (imzalama
#      sertifikaları, App Store Connect API anahtarı vb.) Codemagic'in kendi
#      panelinde "Code signing" ayarlarını sen gireceksin — bunlar özel
#      anahtarlar, benim asla görmemem/girmemem gereken bilgiler.

workflows:
  android-debug:
    name: Android (test paketi, imzasız)
    max_build_duration: 30
    # GERÇEK HATA (2026-09-15): "linux" ve "linux_x2" ikisi de faturalandırma
    # açık hesap istiyor — Codemagic'in ücretsiz planı SADECE mac_mini_m2'de
    # dakika veriyor (500 dk/ay), Linux'ta hiç ücretsiz dakika yok. Android'in
    # Mac makinesinde derlenmesinde teknik bir sorun yok (Gradle/JDK/Android
    # SDK Codemagic'in macOS imajında zaten hazır) — sadece bir makine
    # seçimi, iOS'la aynı ücretsiz havuzu paylaşıyor.
    instance_type: mac_mini_m2
    environment:
      node: 22
      # GERÇEK HATA (2026-09-15): "invalid source release: 21" — Capacitor'ın
      # ürettiği Gradle yapılandırması Java 21 hedefliyor
      # (capacitor.build.gradle), ama build makinesinin varsayılan JDK'sı
      # daha eskiydi. Codemagic'e açıkça hangi JDK'yı kullanacağını
      # söylüyoruz.
      java: 21
      vars:
        PACKAGE_NAME: "com.isinn.app"
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Capacitor senkronize et
        script: npx cap sync android
      - name: Android APK derle (debug)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-debug:
    name: iOS (simülatör test paketi)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Capacitor senkronize et
        script: npx cap sync ios
      # GERÇEK HATA (2026-09-15): burada bir "CocoaPods kur" adımı vardı
      # ("pod install") ama bu proje CocoaPods DEĞİL, Capacitor'ın daha yeni
      # varsayılanı Swift Package Manager kullanıyor — ios/App'te hiç
      # Podfile yok, olması da gerekmiyor. O yüzden .xcworkspace da yok,
      # sadece .xcodeproj — xcodebuild'e "-workspace" değil "-project"
      # verilmesi gerekiyor. SPM bağımlılıkları xcodebuild'in kendisi,
      # derleme sırasında otomatik indirip çözüyor, ayrı bir adım gerekmiyor.
      - name: iOS derle (simülatör için, imzasız)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  # iOS mağaza yayını (TestFlight -> App Store). ÖN KOŞUL (Esra yapar, sırlar sohbete/repoya yazılmaz):
  #   1. Codemagic > Teams > Integrations > App Store Connect: API anahtarını (Issuer ID, Key ID, .p8) ekle,
  #      adını "isinn_app_store_connect" yap (aşağıdaki integration adıyla birebir aynı olmalı).
  #   2. App Store Connect'te com.isinn.app paketi için uygulama kaydını aç.
  #   3. Codemagic > ios-release > Environment variables: APP_STORE_APPLE_ID = App Store Connect > Uygulama Bilgileri > "Apple ID" (sayısal kimlik).
  # Codemagic dağıtım sertifikasını ve App Store profilini API anahtarıyla kendisi üretir.
  ios-release:
    name: iOS (App Store / TestFlight, imzalı)
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: isinn_app_store_connect
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.isinn.app
      vars:
        APP_ID: "com.isinn.app"
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Capacitor senkronize et
        script: npx cap sync ios
      - name: İmzalama profillerini projeye uygula
        script: xcode-project use-profiles
      - name: Derleme numarasını artır (TestFlight'taki son numara + 1)
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          agvtool new-version -all "$NEXT"
      - name: IPA derle
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
